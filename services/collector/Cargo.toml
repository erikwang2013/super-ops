[package]
name = "superops-collector"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SuperOps collector - k8s snapshot, alert inspection, audit ingestion"

[dependencies]
superops-protos = { path = "../../superops-protos" }
ecat = { path = "../../ecat" }
ecat-data = { path = "../../ecat-data" }
ecat-data-clickhouse = { path = "../../ecat-data-clickhouse" }
ecat-data-redis = { path = "../../ecat-data-redis" }
ecat-lock = { path = "../../ecat-lock" }
ecat-mq = { path = "../../ecat-mq" }
ecat-mq-kafka = { path = "../../ecat-mq-kafka" }
ecat-mq-mqtt = { path = "../../ecat-mq-mqtt" }
ecat-mq-nats = { path = "../../ecat-mq-nats" }
ecat-registry = { path = "../../ecat-registry" }
ecat-registry-consul = { path = "../../ecat-registry-consul" }
ecat-registry-etcd = { path = "../../ecat-registry-etcd" }
ecat-events = { path = "../../ecat-events" }
ecat-data-elasticsearch = { path = "../../ecat-data-elasticsearch" }
ecat-data-opensearch = { path = "../../ecat-data-opensearch" }
ecat-scheduler = { path = "../../ecat-scheduler" }
ecat-tracing-otlp = { path = "../../ecat-tracing-otlp" }
tonic.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
async-trait.workspace = true
anyhow = "1"
serde_yaml = "0.9"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono"] }
# B4 邮件通知通道：notify targets kind=email 时经 SMTP 发送（默认带 native-tls 与 tokio1 冲突，须关默认 features）
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls", "webpki-roots", "ring"] }

[dev-dependencies]
tempfile = "3"
