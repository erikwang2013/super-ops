[package]
name = "superops-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SuperOps API Gateway - auth and routing"

[dependencies]
superops-protos = { path = "../../superops-protos" }
ecat = { path = "../../ecat" }
ecat-transport-http = { path = "../../ecat-transport-http" }
ecat-data-sqlx = { path = "../../ecat-data-sqlx" }
tonic.workspace = true
prost.workspace = true
axum.workspace = true
tokio.workspace = true
tower.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow = "1"
serde_yaml = "0.9"
jsonwebtoken = "9"
bcrypt = "0.15"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
