[package]
name = "superops-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SuperOps API Gateway - auth and routing"

[dependencies]
superops-protos = { path = "../../superops-protos" }
ecat = { path = "../../ecat" }
ecat-transport-http = { path = "../../ecat-transport-http" }
ecat-data = { path = "../../ecat-data" }
ecat-data-sqlx = { path = "../../ecat-data-sqlx" }
ecat-data-clickhouse = { path = "../../ecat-data-clickhouse" }
ecat-mq = { path = "../../ecat-mq" }
ecat-mq-kafka = { path = "../../ecat-mq-kafka" }
ecat-mq-mqtt = { path = "../../ecat-mq-mqtt" }
ecat-mq-nats = { path = "../../ecat-mq-nats" }
ecat-events = { path = "../../ecat-events" }
ecat-data-neo4j = { path = "../../ecat-data-neo4j" }
ecat-data-nebulagraph = { path = "../../ecat-data-nebulagraph" }
ecat-data-arangodb = { path = "../../ecat-data-arangodb" }
ecat-data-elasticsearch = { path = "../../ecat-data-elasticsearch" }
ecat-data-opensearch = { path = "../../ecat-data-opensearch" }
ecat-data-s3 = { path = "../../ecat-data-s3" }
ecat-graphql = { path = "../../ecat-graphql" }
ecat-circuit-breaker = { path = "../../ecat-circuit-breaker" }
ecat-registry = { path = "../../ecat-registry" }
ecat-registry-consul = { path = "../../ecat-registry-consul" }
ecat-registry-etcd = { path = "../../ecat-registry-etcd" }
ecat-config = { path = "../../ecat-config" }
ecat-config-remote = { path = "../../ecat-config-remote" }
ecat-middleware = { path = "../../ecat-middleware", features = ["redis"] }
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
ecat-tracing-otlp = { path = "../../ecat-tracing-otlp" }
ecat-auth = { path = "../../ecat-auth" }
ecat-openapi = { path = "../../ecat-openapi" }
async-trait.workspace = true
ecat-health = { path = "../../ecat-health" }
ecat-metrics = { path = "../../ecat-metrics" }
prometheus = "0.13"
tonic.workspace = true
prost.workspace = true
axum = { workspace = true, features = ["ws", "multipart"] }
tokio.workspace = true
tower.workspace = true
futures = "0.3"
tokio-stream = "0.1"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow = "1"
serde_yaml = "0.9"
base64 = "0.22"
bcrypt = "0.15"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono", "uuid", "tls-rustls-ring-webpki"] }
ecat-tls = { path = "../../ecat-tls" }
ecat-security = { path = "../../ecat-security" }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
