<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="860" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#0f172a">SuperOps 分层设计</text>
  <text x="20" y="50" font-size="12" fill="#64748b">展示层 → 接入层 → 服务层 → 数据层 → 可观测；e-cat 框架组件贯穿各层</text>

  <!-- 展示层 -->
  <rect x="430" y="70" width="240" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="94" text-anchor="middle" font-weight="bold" fill="#1e40af">展示层 · Frontend :3000</text>
  <text x="550" y="112" text-anchor="middle" fill="#64748b">Tauri 2 / React + Vite</text>
  <path d="M 550 128 L 550 170" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="560" y="152" fill="#64748b" font-size="12">HTTP / WebSocket</text>

  <!-- 接入层 -->
  <rect x="60" y="170" width="980" height="120" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="60" y="170" width="980" height="30" rx="8" fill="#0f172a"/>
  <rect x="60" y="185" width="980" height="15" fill="#0f172a"/>
  <text x="80" y="190" font-weight="bold" fill="#ffffff">接入层 · Gateway :8080（HTTP / WS）+ :9090（gRPC）</text>
  <rect x="80" y="210" width="120" height="64" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="140" y="230" text-anchor="middle" fill="#b91c1c">WAF 扫描</text>
  <text x="140" y="248" text-anchor="middle" fill="#94a3b8">ecat-security</text>
  <text x="140" y="264" text-anchor="middle" fill="#94a3b8">High/Critical → 403</text>
  <rect x="217" y="210" width="120" height="64" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="277" y="230" text-anchor="middle" fill="#334155">认证三通道</text>
  <text x="277" y="248" text-anchor="middle" fill="#94a3b8">JWT / OAuth2</text>
  <text x="277" y="264" text-anchor="middle" fill="#94a3b8">X-API-Key</text>
  <rect x="354" y="210" width="120" height="64" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="414" y="230" text-anchor="middle" fill="#334155">限流</text>
  <text x="414" y="248" text-anchor="middle" fill="#94a3b8">Redis 计数</text>
  <text x="414" y="264" text-anchor="middle" fill="#94a3b8">超限 429</text>
  <rect x="491" y="210" width="120" height="64" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="551" y="230" text-anchor="middle" fill="#334155">熔断</text>
  <text x="551" y="248" text-anchor="middle" fill="#94a3b8">5xx 连续失败</text>
  <text x="551" y="264" text-anchor="middle" fill="#94a3b8">503 / 半开探针</text>
  <rect x="628" y="210" width="120" height="64" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="688" y="230" text-anchor="middle" fill="#334155">配置热更新</text>
  <text x="688" y="248" text-anchor="middle" fill="#94a3b8">Consul KV</text>
  <text x="688" y="264" text-anchor="middle" fill="#94a3b8">阻塞查询</text>
  <rect x="765" y="210" width="120" height="64" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="825" y="230" text-anchor="middle" fill="#334155">gRPC 代理</text>
  <text x="825" y="248" text-anchor="middle" fill="#94a3b8">HTTP ↔ :9091</text>
  <text x="825" y="264" text-anchor="middle" fill="#94a3b8">WS 终端桥</text>
  <rect x="902" y="210" width="138" height="64" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="971" y="230" text-anchor="middle" fill="#334155">可观测</text>
  <text x="971" y="248" text-anchor="middle" fill="#94a3b8">/metrics</text>
  <text x="971" y="264" text-anchor="middle" fill="#94a3b8">OTLP</text>
  <path d="M 340 290 L 340 320" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 760 290 L 760 320" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="350" y="312" fill="#64748b" font-size="12">gRPC</text>

  <!-- 服务层 -->
  <rect x="60" y="320" width="480" height="130" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="60" y="320" width="480" height="30" rx="8" fill="#0f172a"/>
  <rect x="60" y="335" width="480" height="15" fill="#0f172a"/>
  <text x="80" y="340" font-weight="bold" fill="#ffffff">服务层 · K8s Service :9091</text>
  <text x="80" y="372" fill="#334155">· 集群管理（kubeconfig 增删查）</text>
  <text x="80" y="392" fill="#334155">· Pod / Deployment / Node 查询与 Watch</text>
  <text x="80" y="412" fill="#334155">· 日志流（tail + follow）</text>
  <text x="80" y="432" fill="#334155">· exec 双向流（stdin/stdout/stderr + resize）</text>
  <rect x="560" y="320" width="480" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="560" y="320" width="480" height="30" rx="8" fill="#0f172a"/>
  <rect x="560" y="335" width="480" height="15" fill="#0f172a"/>
  <text x="580" y="340" font-weight="bold" fill="#ffffff">服务层 · Collector</text>
  <text x="580" y="372" fill="#334155">· 周期采集（interval 可配）→ ClickHouse 快照</text>
  <text x="580" y="392" fill="#334155">· 巡检告警（连续 N 次超标 → alert_event）</text>
  <text x="580" y="412" fill="#334155">· Kafka 审计事件消费（superops.audit）</text>
  <text x="580" y="432" fill="#334155">· Redis 分布式锁互斥巡检</text>
  <text x="580" y="452" fill="#334155">· 配置漂移检测 + 发布自动回滚（drift / rollback）</text>
  <path d="M 340 450 L 340 490" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 760 470 L 760 490" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 数据层 -->
  <rect x="60" y="490" width="980" height="160" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="60" y="490" width="980" height="30" rx="8" fill="#0f172a"/>
  <rect x="60" y="505" width="980" height="15" fill="#0f172a"/>
  <text x="80" y="510" font-weight="bold" fill="#ffffff">数据层</text>
  <rect x="80" y="535" width="150" height="100" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="155" y="558" text-anchor="middle" font-weight="bold" fill="#92400e">MySQL 8 :3307</text>
  <text x="155" y="578" text-anchor="middle" fill="#92400e">用户 / API Key</text>
  <text x="155" y="598" text-anchor="middle" fill="#92400e">bcrypt 散列</text>
  <rect x="250" y="535" width="150" height="100" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
  <text x="325" y="558" text-anchor="middle" font-weight="bold" fill="#991b1b">Redis :6380</text>
  <text x="325" y="578" text-anchor="middle" fill="#991b1b">限流计数</text>
  <text x="325" y="598" text-anchor="middle" fill="#991b1b">分布式锁</text>
  <rect x="420" y="535" width="150" height="100" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="495" y="558" text-anchor="middle" font-weight="bold" fill="#166534">ClickHouse :8124</text>
  <text x="495" y="578" text-anchor="middle" fill="#166534">指标快照 / 时序</text>
  <text x="495" y="598" text-anchor="middle" fill="#166534">审计落库</text>
  <rect x="590" y="535" width="150" height="100" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/>
  <text x="665" y="558" text-anchor="middle" font-weight="bold" fill="#6b21a8">Kafka :9092</text>
  <text x="665" y="578" text-anchor="middle" fill="#6b21a8">审计事件总线</text>
  <text x="665" y="598" text-anchor="middle" fill="#6b21a8">superops.audit</text>
  <rect x="760" y="535" width="150" height="100" rx="6" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
  <text x="835" y="558" text-anchor="middle" font-weight="bold" fill="#155e75">Consul :8500</text>
  <text x="835" y="578" text-anchor="middle" fill="#155e75">注册发现</text>
  <text x="835" y="598" text-anchor="middle" fill="#155e75">KV 配置</text>
  <rect x="930" y="535" width="90" height="100" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
  <text x="975" y="558" text-anchor="middle" font-weight="bold" fill="#334155">K8s API</text>
  <text x="975" y="578" text-anchor="middle" fill="#475569">真实集群</text>
  <text x="975" y="598" text-anchor="middle" fill="#475569">（可选）</text>

  <!-- 可观测 -->
  <rect x="60" y="680" width="150" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="135" y="704" text-anchor="middle" font-weight="bold" fill="#334155">Prometheus :9095</text>
  <text x="135" y="722" text-anchor="middle" fill="#64748b">抓取 /metrics</text>
  <rect x="230" y="680" width="150" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="305" y="704" text-anchor="middle" font-weight="bold" fill="#334155">Jaeger :16686</text>
  <text x="305" y="722" text-anchor="middle" fill="#64748b">OTLP span / 追踪</text>
  <rect x="400" y="680" width="640" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="420" y="702" font-weight="bold" fill="#1e40af">可观测</text>
  <text x="420" y="720" fill="#334155">Prometheus 抓取 gateway :8080/metrics；Jaeger 收集 gateway / k8s 的 OTLP span —— 数据流详见「架构总览」</text>
  <path d="M 965 274 L 965 430 L 1070 430 L 1070 708 L 1040 708" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- 框架 -->
  <rect x="60" y="770" width="980" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="80" y="792" font-weight="bold" fill="#334155">e-cat 框架组件（贯穿各层）</text>
  <text x="80" y="814" fill="#64748b">ecat-auth · ecat-middleware · ecat-circuit-breaker · ecat-config-remote · ecat-registry-consul · ecat-mq-kafka</text>
  <text x="80" y="832" fill="#64748b">ecat-scheduler · ecat-lock · ecat-data(-sqlx / -clickhouse / -redis) · ecat-tracing-otlp · ecat-openapi · ecat-security · ecat-tls</text>
</svg>
