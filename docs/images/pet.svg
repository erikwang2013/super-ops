<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13" role="img" aria-labelledby="petTitle petDesc">
  <title id="petTitle">SuperOps 项目宠物 · 超猫 SuperCat</title>
  <desc id="petDesc">超猫是 SuperOps 的运维吉祥物，血统来自 e-cat 框架：耳尖信号波=告警天线，扫描眼=监控视野，项圈 LED=熔断限流，吊牌时钟=7x24 值守，胸前终端=处置台，折线尾巴=指标曲线。</desc>

  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="torso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#d8e0ec"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <text x="20" y="38" font-size="20" font-weight="bold" fill="#0f172a">项目宠物 · 超猫 SuperCat</text>
  <text x="20" y="62" font-size="12.5" fill="#64748b">e-cat 框架的血统 —— 每处身体特征对应平台的一项能力：从「看见」到「处置」的闭环</text>

  <!-- ============ 猫 ============ -->
  <g id="supercat">
    <ellipse cx="300" cy="474" rx="140" ry="12" fill="#cbd5e1" opacity="0.55"/>

    <!-- 尾巴：指标曲线 -->
    <path d="M 360 432 C 424 452, 458 424, 448 384 L 432 362 L 466 344 L 452 314 L 488 296 L 478 268"
          stroke="#2563eb" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ffffff" stroke="#2563eb" stroke-width="2.5">
      <circle cx="448" cy="384" r="4.5"/><circle cx="432" cy="362" r="4.5"/>
      <circle cx="466" cy="344" r="4.5"/><circle cx="452" cy="314" r="4.5"/>
      <circle cx="488" cy="296" r="4.5"/><circle cx="478" cy="268" r="4.5"/>
    </g>

    <!-- 身体 -->
    <path d="M 240 292 C 196 318, 186 392, 198 448 C 204 470, 396 470, 402 448 C 414 392, 404 318, 360 292 Z"
          fill="url(#torso)" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- 耳朵（外） -->
    <path d="M 236 186 L 224 108 L 292 152 Z" fill="url(#fur)" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 364 186 L 376 108 L 308 152 Z" fill="url(#fur)" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- 头 -->
    <ellipse cx="300" cy="232" rx="78" ry="72" fill="url(#fur)" stroke="#0f172a" stroke-width="3.5"/>

    <!-- 耳朵（内） -->
    <path d="M 245 178 L 236 124 L 280 154 Z" fill="#cbd5e1"/>
    <path d="M 355 178 L 364 124 L 320 154 Z" fill="#cbd5e1"/>

    <!-- 眼睛：监控视野 -->
    <g>
      <ellipse cx="272" cy="230" rx="18" ry="20" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
      <circle cx="272" cy="232" r="11" fill="#2563eb"/>
      <ellipse cx="272" cy="232" rx="5.5" ry="9" fill="#0f172a"/>
      <circle cx="266" cy="222" r="4.5" fill="#ffffff"/>
      <ellipse cx="328" cy="230" rx="18" ry="20" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
      <circle cx="328" cy="232" r="11" fill="#2563eb"/>
      <ellipse cx="328" cy="232" rx="5.5" ry="9" fill="#0f172a"/>
      <circle cx="322" cy="222" r="4.5" fill="#ffffff"/>
    </g>

    <!-- 鼻 / 嘴 / 胡须 -->
    <path d="M 291 252 Q 300 246 309 252 L 300 262 Z" fill="#f9a8d4"/>
    <path d="M 300 262 Q 300 271 290 271 Q 282 271 280 264" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 300 262 Q 300 271 310 271 Q 318 271 320 264" stroke="#64748b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
      <path d="M 246 246 L 200 238"/><path d="M 246 256 L 198 256"/><path d="M 246 266 L 202 274"/>
      <path d="M 354 246 L 400 238"/><path d="M 354 256 L 402 256"/><path d="M 354 266 L 398 274"/>
    </g>

    <!-- 耳尖信号波：告警天线 -->
    <g fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round">
      <g transform="translate(224,102) rotate(-30)">
        <path d="M -7.07 -7.07 A 10 10 0 0 1 7.07 -7.07"/>
        <path d="M -11.31 -11.31 A 16 16 0 0 1 11.31 -11.31"/>
        <path d="M -15.56 -15.56 A 22 22 0 0 1 15.56 -15.56"/>
        <circle cx="0" cy="0" r="2.5" fill="#2563eb" stroke="none"/>
      </g>
      <g transform="translate(376,102) rotate(30)">
        <path d="M -7.07 -7.07 A 10 10 0 0 1 7.07 -7.07"/>
        <path d="M -11.31 -11.31 A 16 16 0 0 1 11.31 -11.31"/>
        <path d="M -15.56 -15.56 A 22 22 0 0 1 15.56 -15.56"/>
        <circle cx="0" cy="0" r="2.5" fill="#2563eb" stroke="none"/>
      </g>
    </g>

    <!-- 项圈：熔断器状态灯 -->
    <rect x="236" y="298" width="128" height="22" rx="11" fill="#2563eb" stroke="#1e40af" stroke-width="2.5"/>
    <circle cx="350" cy="309" r="10" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.45"/>
    <circle cx="350" cy="309" r="6.5" fill="#22c55e" stroke="#ffffff" stroke-width="1.5"/>

    <!-- 吊牌：7x24 值守时钟 -->
    <circle cx="300" cy="336" r="17" fill="#eff6ff" stroke="#1e40af" stroke-width="2.5"/>
    <circle cx="300" cy="336" r="11.5" fill="none" stroke="#2563eb" stroke-width="2"/>
    <path d="M 300 336 L 300 327" stroke="#1e40af" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 300 336 L 307 340" stroke="#1e40af" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="300" cy="336" r="2" fill="#1e40af"/>

    <!-- 胸前终端：处置台 -->
    <rect x="256" y="366" width="88" height="62" rx="9" fill="#0f172a"/>
    <circle cx="268" cy="378" r="2.5" fill="#64748b"/>
    <circle cx="277" cy="378" r="2.5" fill="#64748b"/>
    <circle cx="286" cy="378" r="2.5" fill="#64748b"/>
    <path d="M 256 388 L 344 388" stroke="#334155" stroke-width="2"/>
    <text x="265" y="406" font-size="13" font-weight="bold" fill="#22c55e" font-family="'DejaVu Sans Mono',monospace">$</text>
    <rect x="276" y="400" width="34" height="5" rx="2.5" fill="#334155"/>
    <rect x="265" y="416" width="54" height="5" rx="2.5" fill="#334155"/>

    <!-- 前爪 -->
    <rect x="238" y="432" width="48" height="38" rx="16" fill="url(#fur)" stroke="#0f172a" stroke-width="3"/>
    <rect x="314" y="432" width="48" height="38" rx="16" fill="url(#fur)" stroke="#0f172a" stroke-width="3"/>
    <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
      <path d="M 252 448 L 252 462"/><path d="M 272 448 L 272 462"/>
      <path d="M 328 448 L 328 462"/><path d="M 348 448 L 348 462"/>
    </g>
  </g>

  <!-- ============ 引线 + 说明卡 ============ -->
  <g stroke="#94a3b8" stroke-width="1.3" fill="none">
    <path d="M 376 100 C 440 104, 500 140, 556 140"/>
    <path d="M 346 230 C 430 230, 490 212, 556 212"/>
    <path d="M 488 296 C 518 296, 526 284, 556 284"/>
    <path d="M 358 309 C 430 312, 500 356, 556 356"/>
    <path d="M 317 336 C 400 360, 470 428, 556 428"/>
    <path d="M 344 396 C 420 420, 490 500, 556 500"/>
  </g>
  <g fill="#2563eb" stroke="#ffffff" stroke-width="1.5">
    <circle cx="376" cy="100" r="4"/><circle cx="346" cy="230" r="4"/>
    <circle cx="488" cy="296" r="4"/><circle cx="358" cy="309" r="4"/>
    <circle cx="317" cy="336" r="4"/><circle cx="344" cy="396" r="4"/>
  </g>

  <g>
    <rect x="560" y="114" width="320" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="572" y="134" width="10" height="10" rx="3" fill="#2563eb"/>
    <text x="596" y="138" font-size="14" font-weight="bold" fill="#0f172a">耳尖信号波 · 告警天线</text>
    <text x="596" y="156" font-size="11.5" fill="#64748b">规则求值 → 钉钉 / 企微 / 邮件通知</text>

    <rect x="560" y="186" width="320" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="572" y="206" width="10" height="10" rx="3" fill="#2563eb"/>
    <text x="596" y="210" font-size="14" font-weight="bold" fill="#0f172a">扫描眼 · 监控视野</text>
    <text x="596" y="228" font-size="11.5" fill="#64748b">集群资源 / Pod 日志 / 终端 / 链路</text>

    <rect x="560" y="258" width="320" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="572" y="278" width="10" height="10" rx="3" fill="#2563eb"/>
    <text x="596" y="282" font-size="14" font-weight="bold" fill="#0f172a">折线尾巴 · 指标曲线</text>
    <text x="596" y="300" font-size="11.5" fill="#64748b">快照落 ClickHouse，容量 / 成本趋势</text>

    <rect x="560" y="330" width="320" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="572" y="350" width="10" height="10" rx="3" fill="#22c55e"/>
    <text x="596" y="354" font-size="14" font-weight="bold" fill="#0f172a">项圈 LED · 熔断 &amp; 限流</text>
    <text x="596" y="372" font-size="11.5" fill="#64748b">5xx 熔断 10s，Redis 共享计数</text>

    <rect x="560" y="402" width="320" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="572" y="422" width="10" height="10" rx="3" fill="#2563eb"/>
    <text x="596" y="426" font-size="14" font-weight="bold" fill="#0f172a">吊牌时钟 · 7×24 值守</text>
    <text x="596" y="444" font-size="11.5" fill="#64748b">巡检互斥锁 / 自愈冷却 / 排班</text>

    <rect x="560" y="474" width="320" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="572" y="494" width="10" height="10" rx="3" fill="#0f172a"/>
    <text x="596" y="498" font-size="14" font-weight="bold" fill="#0f172a">胸前终端 · 处置台</text>
    <text x="596" y="516" font-size="11.5" fill="#64748b">gRPC 代理 / 脚本 Job / Runbook</text>
  </g>

  <!-- ============ 三态图例 ============ -->
  <rect x="20" y="540" width="860" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="40" y="566" font-size="13" font-weight="bold" fill="#1e40af">项圈 LED 三态 —— 随平台健康度变化</text>
  <g>
    <circle cx="46" cy="583" r="6" fill="#22c55e"/><text x="58" y="587" font-size="12" fill="#334155">健康</text>
    <circle cx="126" cy="583" r="6" fill="#f59e0b"/><text x="138" y="587" font-size="12" fill="#334155">降级</text>
    <circle cx="206" cy="583" r="6" fill="#ef4444"/><text x="218" y="587" font-size="12" fill="#334155">熔断</text>
    <text x="300" y="587" font-size="12" fill="#334155">绿 = 熔断器闭合正常放行 · 黄 = 半开探针 / 后端回退 · 红 = 熔断打开，请求 503 快速失败</text>
  </g>
</svg>
