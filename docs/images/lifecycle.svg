<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="700" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#0f172a">SuperOps 服务生命周期</text>
  <text x="20" y="50" font-size="12" fill="#64748b">e-cat 框架统一管理：App::builder 装配 → on_start 注册 → Drop 优雅退出</text>

  <!-- 启动 -->
  <rect x="60" y="90" width="300" height="430" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="60" y="90" width="300" height="28" rx="8" fill="#0f172a"/>
  <rect x="60" y="104" width="300" height="14" fill="#0f172a"/>
  <text x="80" y="109" font-weight="bold" fill="#ffffff">Phase 1 · 启动（startup）</text>
  <text x="80" y="148" fill="#334155">1. 加载 gateway.yaml + env 覆盖</text>
  <text x="80" y="170" fill="#94a3b8" font-size="11.5">  哨兵检查开发密钥 · 缺失告警</text>
  <text x="80" y="200" fill="#334155">2. MySQL 连接池 / Redis 客户端</text>
  <text x="80" y="222" fill="#94a3b8" font-size="11.5">  ecat-data-sqlx / ecat-data-redis</text>
  <text x="80" y="252" fill="#334155">3. MQ 后端 / OTLP exporter</text>
  <text x="80" y="274" fill="#94a3b8" font-size="11.5">  mqtt > nats > kafka 优先级</text>
  <text x="80" y="304" fill="#334155">4. ecat::App::builder() 装配</text>
  <text x="80" y="326" fill="#94a3b8" font-size="11.5">  transport-http / transport-grpc</text>
  <text x="80" y="348" fill="#94a3b8" font-size="11.5">  auth / middleware / breaker</text>
  <text x="80" y="378" fill="#334155">5. on_start：etcd / Consul 注册</text>
  <text x="80" y="400" fill="#94a3b8" font-size="11.5">  service name / addr / health check</text>
  <text x="80" y="430" fill="#334155">6. 监听 :8080 / :9090</text>
  <text x="80" y="452" fill="#94a3b8" font-size="11.5">  HTTP / WebSocket / gRPC</text>

  <!-- 运行 -->
  <rect x="400" y="90" width="300" height="430" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="400" y="90" width="300" height="28" rx="8" fill="#0f172a"/>
  <rect x="400" y="104" width="300" height="14" fill="#0f172a"/>
  <text x="420" y="109" font-weight="bold" fill="#ffffff">Phase 2 · 运行（running）</text>
  <text x="420" y="148" fill="#334155">1. WAF 扫描 → 认证 → 限流 → 熔断 → 路由</text>
  <text x="420" y="170" fill="#94a3b8" font-size="11.5">  ecat-auth / ecat-middleware</text>
  <text x="420" y="200" fill="#334155">2. gRPC 代理查询 / WS 终端桥</text>
  <text x="420" y="222" fill="#94a3b8" font-size="11.5">  HTTP ↔ :9091 双向流</text>
  <text x="420" y="252" fill="#334155">3. Consul KV 阻塞查询 · 热更新</text>
  <text x="420" y="274" fill="#94a3b8" font-size="11.5">  阈值配置即时生效</text>
  <text x="420" y="304" fill="#334155">4. /metrics 抓取 · OTLP span</text>
  <text x="420" y="326" fill="#94a3b8" font-size="11.5">  Prometheus / Jaeger</text>
  <text x="420" y="356" fill="#334155">5. 关键操作审计 → Kafka</text>
  <text x="420" y="378" fill="#94a3b8" font-size="11.5">  superops.audit → ClickHouse</text>
  <text x="420" y="408" fill="#334155">6. 周期采集 / 巡检（Collector）</text>
  <text x="420" y="430" fill="#94a3b8" font-size="11.5">  ecat-scheduler + Redis 互斥锁</text>
  <text x="420" y="458" fill="#334155">7. 领域事件发布（ecat-events）</text>
  <text x="420" y="480" fill="#94a3b8" font-size="11.5">  alert / drift / rollback</text>

  <!-- 退出 -->
  <rect x="740" y="90" width="300" height="430" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="740" y="90" width="300" height="28" rx="8" fill="#0f172a"/>
  <rect x="740" y="104" width="300" height="14" fill="#0f172a"/>
  <text x="760" y="109" font-weight="bold" fill="#ffffff">Phase 3 · 退出（shutdown）</text>
  <text x="760" y="148" fill="#334155">1. SIGTERM → graceful shutdown</text>
  <text x="760" y="170" fill="#94a3b8" font-size="11.5">  停止接收新请求</text>
  <text x="760" y="200" fill="#334155">2. Consul 注销（deregister）</text>
  <text x="760" y="222" fill="#94a3b8" font-size="11.5">  通知注册中心下线</text>
  <text x="760" y="252" fill="#334155">3. OTLP flush · 审计队列排空</text>
  <text x="760" y="274" fill="#94a3b8" font-size="11.5">  追踪与事件不丢失</text>
  <text x="760" y="304" fill="#334155">4. 连接池关闭 · 任务句柄 Join</text>
  <text x="760" y="326" fill="#94a3b8" font-size="11.5">  MySQL / Redis / Kafka</text>
  <text x="760" y="356" fill="#334155">5. 进程退出（码 0）</text>

  <!-- 阶段箭头 -->
  <path d="M 360 300 L 400 300" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="362" y="290" fill="#64748b" font-size="12">运行中</text>
  <path d="M 700 300 L 740 300" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="702" y="290" fill="#64748b" font-size="12">信号</text>

  <!-- 底部说明 -->
  <rect x="60" y="560" width="980" height="104" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="80" y="586" font-weight="bold" fill="#1e40af">生命周期由 e-cat 框架统一管理</text>
  <text x="80" y="612" fill="#334155">· App::builder() 装配各组件并注入配置、存储与消息依赖</text>
  <text x="80" y="632" fill="#334155">· on_start 钩子完成注册（etcd / Consul）与健康检查；退出时框架负责注销、flush 与资源释放</text>
  <text x="80" y="652" fill="#334155">· 领域事件 / GraphQL / 拓扑等新扩展沿用同一装配流程</text>
</svg>
