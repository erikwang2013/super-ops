<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="'DejaVu Sans','Helvetica Neue',Arial,sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="780" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#0f172a">SuperOps 架构总览</text>
  <text x="20" y="50" font-size="12" fill="#64748b">HTTP ── / WS ── / gRPC ── / OTLP ── / KV ──</text>

  <!-- Frontend -->
  <rect x="430" y="70" width="240" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="94" text-anchor="middle" font-weight="bold" fill="#1e40af">Frontend</text>
  <text x="550" y="112" text-anchor="middle" fill="#64748b">Tauri 2 / React + Vite  (:3000)</text>
  <text x="550" y="128" text-anchor="middle" fill="#94a3b8">集群 / Pod / 日志 / 终端 / 指标</text>

  <!-- Services -->
  <rect x="40" y="200" width="300" height="200" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="40" y="200" width="300" height="34" rx="8" fill="#0f172a"/>
  <rect x="40" y="217" width="300" height="17" fill="#0f172a"/>
  <text x="190" y="222" text-anchor="middle" font-weight="bold" fill="#ffffff">Gateway  :8080</text>
  <text x="56" y="258" fill="#334155">· 认证：JWT / OAuth2 / X-API-Key（ecat-auth）</text>
  <text x="56" y="278" fill="#334155">· 限流：Redis 共享 + Consul 动态阈值</text>
  <text x="56" y="298" fill="#334155">· 熔断：5xx 连续失败 → 10s 半开探针</text>
  <text x="56" y="318" fill="#334155">· WS 终端桥：浏览器 ↔ gRPC 双向流</text>
  <text x="56" y="338" fill="#334155">· OpenAPI 文档 /api/docs</text>
  <text x="56" y="358" fill="#334155">· 指标 /metrics + OTLP 追踪导出</text>
  <text x="56" y="378" fill="#334155">· Consul 注册 / 发现 / KV 热更新</text>

  <rect x="400" y="200" width="300" height="200" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="400" y="200" width="300" height="34" rx="8" fill="#0f172a"/>
  <rect x="400" y="217" width="300" height="17" fill="#0f172a"/>
  <text x="550" y="222" text-anchor="middle" font-weight="bold" fill="#ffffff">K8s Service  :9091</text>
  <text x="416" y="258" fill="#334155">· 集群管理：kubeconfig 增删查</text>
  <text x="416" y="278" fill="#334155">· Pod / Deployment / Node 查询</text>
  <text x="416" y="298" fill="#334155">· Pod 日志流（tail + follow）</text>
  <text x="416" y="318" fill="#334155">· exec 双向流（stdin/stdout/</text>
  <text x="416" y="334" fill="#334155">  stderr + terminal resize）</text>
  <text x="416" y="354" fill="#334155">· 资源 Watch（ADDED/MODIFIED/DELETED）</text>
  <text x="416" y="374" fill="#334155">· Consul 注册</text>

  <rect x="760" y="200" width="300" height="200" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="760" y="200" width="300" height="34" rx="8" fill="#0f172a"/>
  <rect x="760" y="217" width="300" height="17" fill="#0f172a"/>
  <text x="910" y="222" text-anchor="middle" font-weight="bold" fill="#ffffff">Collector</text>
  <text x="776" y="258" fill="#334155">· 调度：周期采集 + 巡检（interval 可配）</text>
  <text x="776" y="278" fill="#334155">· 指标快照 → ClickHouse 时序落库</text>
  <text x="776" y="298" fill="#334155">· 告警规则（连续 N 次超标 → 事件）</text>
  <text x="776" y="318" fill="#334155">· 巡检互斥：Redis 分布式锁</text>
  <text x="776" y="338" fill="#334155">· Kafka 审计事件消费（ecat-mq-kafka）</text>
  <text x="776" y="358" fill="#334155">· gateway 指标查询 API 的数据源</text>
  <text x="776" y="378" fill="#334155">· Consul 注册</text>

  <!-- Data layer -->
  <rect x="40" y="470" width="150" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="115" y="494" text-anchor="middle" font-weight="bold" fill="#92400e">MySQL 8 :3307</text>
  <text x="115" y="512" text-anchor="middle" fill="#92400e">用户 / API Key</text>

  <rect x="210" y="470" width="150" height="56" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="285" y="494" text-anchor="middle" font-weight="bold" fill="#991b1b">Redis :6380</text>
  <text x="285" y="512" text-anchor="middle" fill="#991b1b">限流计数 / 分布式锁</text>

  <rect x="380" y="470" width="170" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="465" y="494" text-anchor="middle" font-weight="bold" fill="#166534">ClickHouse :8124</text>
  <text x="465" y="512" text-anchor="middle" fill="#166534">指标快照 / 时序</text>

  <rect x="570" y="470" width="150" height="56" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="645" y="494" text-anchor="middle" font-weight="bold" fill="#6b21a8">Kafka :9092</text>
  <text x="645" y="512" text-anchor="middle" fill="#6b21a8">审计事件总线</text>

  <rect x="740" y="470" width="150" height="56" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
  <text x="815" y="494" text-anchor="middle" font-weight="bold" fill="#155e75">Consul :8500</text>
  <text x="815" y="512" text-anchor="middle" fill="#155e75">注册发现 / KV 配置</text>

  <rect x="910" y="470" width="150" height="56" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="985" y="494" text-anchor="middle" font-weight="bold" fill="#334155">Kubernetes API</text>
  <text x="985" y="512" text-anchor="middle" fill="#334155">真实集群（可选）</text>

  <!-- Observability -->
  <rect x="40" y="580" width="150" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="115" y="604" text-anchor="middle" font-weight="bold" fill="#334155">Prometheus :9095</text>
  <text x="115" y="622" text-anchor="middle" fill="#64748b">抓取 /metrics</text>

  <rect x="210" y="580" width="150" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="285" y="604" text-anchor="middle" font-weight="bold" fill="#334155">Jaeger :16686</text>
  <text x="285" y="622" text-anchor="middle" fill="#64748b">OTLP span / 追踪</text>

  <!-- Edges -->
  <path d="M 550 126 L 550 200" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="560" y="168" fill="#64748b" font-size="12">HTTP / WS</text>

  <path d="M 340 300 L 400 300" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="345" y="290" fill="#64748b" font-size="12">gRPC</text>

  <path d="M 700 300 L 760 300" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="706" y="290" fill="#64748b" font-size="12">gRPC</text>

  <path d="M 550 400 L 550 470" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="560" y="440" fill="#64748b" font-size="12">K8s API</text>

  <path d="M 115 400 L 115 470" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="125" y="440" fill="#64748b" font-size="12">SQL</text>

  <path d="M 285 400 L 285 470" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="295" y="440" fill="#64748b" font-size="12">限流/锁</text>

  <path d="M 465 400 L 465 470" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="475" y="440" fill="#64748b" font-size="12">快照写入</text>

  <path d="M 645 400 L 645 470" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="655" y="440" fill="#64748b" font-size="12">审计消费</text>

  <path d="M 815 256 L 815 470" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="825" y="360" fill="#64748b" font-size="12">注册 / KV</text>

  <path d="M 190 238 L 815 238" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  <text x="500" y="232" fill="#2563eb" font-size="12">Consul 注册 / 发现 / KV 热更新（阻塞查询）</text>

  <path d="M 190 380 L 115 380 L 115 470" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="100" y="372" fill="#64748b" font-size="12">MySQL</text>

  <path d="M 340 378 L 285 378 L 285 470" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="298" y="370" fill="#64748b" font-size="12">Redis</text>

  <path d="M 400 268 L 115 268 L 115 470" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  <text x="200" y="262" fill="#2563eb" font-size="12">Prometheus 抓取 /metrics</text>
  <path d="M 115 268 L 115 470" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <path d="M 760 222 L 285 222 L 285 580" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  <path d="M 285 580 L 285 636" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="470" y="216" fill="#2563eb" font-size="12">OTLP 追踪导出（gateway / k8s）</text>

  <rect x="40" y="700" width="1020" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="722" font-weight="bold" fill="#334155">e-cat 框架组件</text>
  <text x="60" y="744" fill="#64748b">ecat-auth · ecat-circuit-breaker · ecat-config-remote · ecat-registry(-consul) · ecat-mq-kafka · ecat-scheduler · ecat-lock · ecat-data-clickhouse · ecat-middleware · ecat-tracing-otlp · ecat-openapi · ecat-bench</text>
</svg>
