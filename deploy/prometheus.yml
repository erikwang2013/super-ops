# 抓取三服务 HTTP /metrics。k8s :9101 与 collector :9102 为约定指标端口
#（进程内 HTTP 暴露尚未接线时 scrape 会失败，属预期）。
# 勿把 Kafka 9092/9093 配进 scrape——那是 Kafka 协议端口，不是 Prometheus。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: superops-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: superops-k8s
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9101"]
  - job_name: superops-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9102"]
