# 默认 GHCR；生产用 --set image.repository / image.tag 覆盖。本 chart 不构建、不推送镜像。
image:
  repository: ghcr.io/erikwang2013/super-ops
  tag: "1.9.0"
  pullPolicy: IfNotPresent
replicas:
  gateway: 1
  k8s: 1
  collector: 1
# 覆盖 configmap 的额外键值；密码仅经 env / Secret 注入，不落 configmap。
# 键名须为服务实际读取的 env 名：GATEWAY_CONFIG / K8S_CONFIG / COLLECTOR_CONFIG，
# 值即对应 YAML 文本（示例见 config/ 下 gateway.yaml、k8s-service.yaml、collector.yaml）。
config: {}
