apiVersion: apps/v1
kind: Deployment
metadata:
  name: superops-gateway
spec:
  replicas: {{ .Values.replicas.gateway }}
  selector:
    matchLabels:
      app: superops-gateway
  template:
    metadata:
      labels:
        app: superops-gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}/gateway:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: superops-config
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
