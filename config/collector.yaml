ch:
  base_url: "http://localhost:8124"
  database: "superops"
mq:
  brokers: "localhost:9092"
  group_id: "superops-collector"
lock:
  url: "redis://localhost:6380"
k8s:
  endpoint: "http://localhost:9091"
collector:
  collect_interval_secs: 60
  inspect_interval_secs: 600
  max_not_ready: 1
  alert_consecutive: 2

consul:
  address: "http://localhost:8500"

# P6-6: OTLP 端点（扁平字符串，gateway/k8s/collector 三服务导出）
otlp: "http://localhost:4317"

notify:
  silence_secs: 300
  # B4: 通知通道 —— webhook(generic/dingtalk/wecom) 或邮件(email，收件人写在 url，逗号分隔多个)
  targets: []
  # - name: mail-ops
  #   kind: email
  #   url: "ops@example.com,oncall@example.com"

# B4: SMTP 配置（kind=email 的 notify target 需要；密码可用 SUPEROPS_SMTP_PASSWORD 覆盖）
# smtp:
#   host: smtp.example.com
#   port: 587
#   username: superops
#   password: change-me
#   from: superops@example.com

logtail:
  enabled: false
  namespaces: ["default"]
  tail_lines: 200
  max_line_bytes: 1024
  interval_secs: 30

# P6-4: 治理任务 — MySQL 备份（mysqldump → backup_dir，保留 BACKUP_KEEP 份）+ 容量/成本估算
housekeeping:
  enabled: true
  interval_secs: 86400

# P6-5: 自愈动作（规则 action=restart/scale 时执行；默认关闭，需显式开启）
selfheal:
  enabled: false
  cluster_id: "default"
  max_actions_per_cycle: 5

mysql:
  host: "localhost"
  port: 3307
  user: "root"
  password: "root123"
  database: "superops"
  backup_dir: "data/backups"
