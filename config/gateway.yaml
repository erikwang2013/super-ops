server:
  http_port: 8080
  grpc_port: 9090

auth:
  jwt_secret: "change-me-in-production-0123456789abcdef"
  access_token_ttl: 1800
  refresh_token_ttl: 604800

database:
  url: "mysql://superops:superops@localhost:3307/superops"

redis:
  url: "redis://localhost:6380"

services:
  k8s:
    endpoint: "http://localhost:9091"

ch:
  base_url: "http://localhost:8124"
  database: "superops"

mq:
  brokers: "localhost:9092"
  group_id: "superops-gateway"

consul:
  address: "http://localhost:8500"

# P6-6: OTLP 端点（扁平字符串，gateway/k8s/collector 三服务导出）
otlp: "http://localhost:4317"

# P6-1: 审批工作流 — enabled 时删除 deployment 需先创建并审批通过 delete 审批单
approval:
  enabled: false

# P6-5: 终端录制 — enabled 时 exec ws 会话逐帧写入 ClickHouse（可经 /api/recordings 回放）
recording:
  enabled: true

# B3: 终端会话管控 — require_confirm 时 ws 升级需带 ?confirm=1（前端连接前弹确认）；
# max_session_secs 为会话时长上限，到点强制断开（0 表示不限时）
terminal:
  require_confirm: true
  max_session_secs: 1800
