name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (workspace fmt + check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ecat-protos / superops-protos 的 build.rs 调用 tonic_build，需要 protoc
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace

  clippy:
    name: Clippy (workspace, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  images:
    name: Docker images (build only, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway
        run: docker build -f services/gateway/Dockerfile -t superops/gateway:${{ github.sha }} .
      - name: Build k8s
        run: docker build -f services/k8s/Dockerfile -t superops/k8s:${{ github.sha }} .
      - name: Build collector
        run: docker build -f services/collector/Dockerfile -t superops/collector:${{ github.sha }} .

  bench-smoke:
    name: Bench smoke (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Build bench
        run: cargo build -p bench
