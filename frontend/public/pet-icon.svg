<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SuperOps 超猫">
  <title>SuperOps 超猫 SuperCat</title>
  <rect width="64" height="64" rx="14" fill="#f8fafc"/>
  <!-- 耳朵 -->
  <path d="M 16 22 L 12 3 L 29 12 Z" fill="#f1f5f9" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M 48 22 L 52 3 L 35 12 Z" fill="#f1f5f9" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- 头 -->
  <ellipse cx="32" cy="34" rx="20" ry="18" fill="#f1f5f9" stroke="#0f172a" stroke-width="2.2"/>
  <path d="M 19 20 L 16 8 L 26 13 Z" fill="#cbd5e1"/>
  <path d="M 45 20 L 48 8 L 38 13 Z" fill="#cbd5e1"/>
  <!-- 眼：蓝色虹膜 = 监控视野 -->
  <ellipse cx="25" cy="33" rx="4.6" ry="5.2" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
  <circle cx="25" cy="33.5" r="2.6" fill="#2563eb"/>
  <circle cx="25" cy="33.5" r="1.5" fill="#0f172a"/>
  <ellipse cx="39" cy="33" rx="4.6" ry="5.2" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/>
  <circle cx="39" cy="33.5" r="2.6" fill="#2563eb"/>
  <circle cx="39" cy="33.5" r="1.5" fill="#0f172a"/>
  <!-- 鼻 / 嘴 -->
  <path d="M 29.5 41 Q 32 39 34.5 41 L 32 43.5 Z" fill="#f9a8d4"/>
  <path d="M 32 43.5 Q 32 46 29.5 46" stroke="#64748b" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M 32 43.5 Q 32 46 34.5 46" stroke="#64748b" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- 项圈 + 熔断状态灯 -->
  <rect x="17" y="50" width="30" height="7" rx="3.5" fill="#2563eb" stroke="#1e40af" stroke-width="1.2"/>
  <circle cx="42" cy="53.5" r="2.6" fill="#22c55e" stroke="#ffffff" stroke-width="0.8"/>
</svg>
